name = "aquaman-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# Created by "npx wrangler d1 create aquaman".
[[d1_databases]]
binding = "DB"
database_name = "aquaman"
database_id = "d2015fb6-dc3b-4f72-99c2-2f5c4ac46b91"

# The queue of the imports of the public history of the "beaux tirages": one instance, one import at a time.
[[durable_objects.bindings]]
name = "PULLS_WRITER"
class_name = "PullsWriter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PullsWriter"]

# Every 5 minutes: reads the game's feed (secret GAME_COOKIE). Every day at 4 h (UTC): forgets the openings older than a year.
[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]
