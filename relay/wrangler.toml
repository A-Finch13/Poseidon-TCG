name = "aquaman-relay"
main = "worker.js"
compatibility_date = "2026-10-01"

# Créé par « npx wrangler d1 create aquaman ».
[[d1_databases]]
binding = "DB"
database_name = "aquaman"
database_id = "d2015fb6-dc3b-4f72-99c2-2f5c4ac46b91"

# La file des imports de l'historique public des « beaux tirages » : une instance, un import à la fois.
[[durable_objects.bindings]]
name = "PULLS_WRITER"
class_name = "PullsWriter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PullsWriter"]

# Toutes les 5 minutes : lit le fil du jeu (secret GAME_COOKIE). Chaque jour à 4 h (UTC) : oublie les ouvertures de plus
# d'un an.
[triggers]
crons = ["*/5 * * * *", "0 4 * * *"]
